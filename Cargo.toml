[package]
name = "blitzen"
version = "0.1.0"
edition = "2021"
description = "Blitzen — the sigma-rust eval-tier runner for the SANTA conformance suite"

[dependencies]
ergotree-ir = { path = "../sigma-rust/sigma-rust/ergotree-ir" }
# `arbitrary` feature unlocks `ergotree_interpreter::eval::test_util` (the only public
# arbitrary-root eval entry); we never use its random `force_any_val` — the runner
# builds a deterministic Context by hand. Swap to a stable public eval hook if/when
# one lands upstream.
ergotree-interpreter = { path = "../sigma-rust/sigma-rust/ergotree-interpreter", features = ["arbitrary"] }
ergo-chain-types = { path = "../sigma-rust/sigma-rust/ergo-chain-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
